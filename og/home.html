<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=DM+Mono:wght@400&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#ebebe5;color:#1b2232;font-family:'Familjen Grotesk',sans-serif}
.card{box-sizing:border-box;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:22px;color:#5a5d64}
.mid{display:flex;align-items:flex-end;gap:64px}
h1{margin:0;font-size:150px;line-height:.86;letter-spacing:-.04em;font-weight:700}
.tag{font-size:44px;font-weight:500;letter-spacing:-.015em;padding-bottom:10px}
.lanes{display:flex;flex-direction:column;gap:12px;border-top:2px solid #1b2232;padding:18px 0 4px;position:relative}
.lane{position:relative;height:14px}
.lane i{position:absolute;top:0;height:14px}
.lane i.own{height:5px;top:4.5px}
.lane b{position:absolute;top:0;width:13px;height:13px;transform:rotate(45deg)}
.now{position:absolute;right:0;top:0;bottom:0;border-right:3px dashed #1b2232}
</style></head><body><div class="card">
<div class="top"><span>russhamer.com</span><span>philosophy · education · ventures · games · esports</span></div>
<div class="mid"><h1>Russ<br>Hamer</h1><p class="tag">Too curious not to.</p></div>
<div class="lanes">
<div class="lane"><b style="left:9%;background:#2f5fc4"></b><b style="left:15%;background:#2f5fc4"></b><b style="left:29%;background:#2f5fc4"></b><b style="left:35%;background:#2f5fc4"></b><b style="left:40%;background:#2f5fc4"></b><b style="left:54%;background:#2f5fc4"></b><i style="left:91%;width:9%;background:linear-gradient(#2f5fc4,#2f5fc4) center/100% 5px no-repeat,repeating-linear-gradient(90deg,#2f5fc4 0 3px,transparent 3px 7px)"></i></div>
<div class="lane"><i style="left:2%;width:24%;background:#11917a73"></i><i style="left:27%;width:3%;background:#11917a73"></i><i style="left:55%;width:30%;background:#11917a73"></i><i style="left:95%;width:5%;background:#11917a"></i></div>
<div class="lane"><i style="left:50%;width:37%;background:#7a45c773"></i><i style="left:87%;width:13%;background:#7a45c7"></i></div>
<div class="lane"><i style="left:36%;width:15%;background:#d0466b73"></i><b style="left:88%;background:#d0466b"></b><i class="own" style="left:96%;width:4%;background:#d0466b"></i></div>
<div class="lane"><i style="left:31%;width:21%;background:#ad770873"></i><i class="own" style="left:85%;width:15%;background:#ad7708"></i></div>
<div class="lane"><i class="own" style="left:22%;width:78%;background:#6f6c66"></i><b style="left:97%;background:#6f6c66"></b></div>
<span class="now"></span>
</div>
</div></body></html>
