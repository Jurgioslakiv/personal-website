# Publishes the site to GitHub Pages, with a fresh essay list every time.
#
# Runs when you push a change, once a day (to pick up new Substack posts), and
# whenever you press "Run workflow" on the Actions tab. It never commits anything;
# it just fetches the latest essays, builds the site into _site/, and deploys that.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *" # every day, ~7am Eastern
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest essays
        # If Substack is down, keep going: the essays.json already in the repo is used.
        continue-on-error: true
        run: node scripts/fetch-essays.mjs
      - name: Build site
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
